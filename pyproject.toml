[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# so regras que nao mudam comportamento: pycodestyle (E, W), pyflakes (F), isort (I)
select = ["E", "F", "I", "W"]
# `l` = lancamento e convencao do dominio em todo o motor
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# testes: fixtures importadas por nome (F401/F811 sao falso positivo do pytest),
# `import app.main` de proposito, e tabelas de dados compactas (E701/E702/E501)
"tests/**" = ["F401", "F811", "E402", "E501", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
